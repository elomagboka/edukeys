services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: edukeys
      POSTGRES_USER: edukeys
      POSTGRES_PASSWORD: edukeys
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edukeys -d edukeys"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
