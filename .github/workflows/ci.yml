name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detecter:
    runs-on: ubuntu-latest
    outputs:
      frontend_present: ${{ steps.verifier.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: verifier
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Frontend absent -job ignoré jusqu'a T-11."
          fi
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers a besoin de Docker : disponible nativement sur les
      # runners GitHub, rien à installer.
      #
      # `clean` n'est pas décoratif : Maven ne retire pas de target/ une
      # ressource supprimée des sources. Sans lui, une migration Flyway
      # renommée ou supprimée reste servie depuis target/classes, et le build
      # passe au vert sur un état du schéma qui n'existe dans aucune source.
      - name: Tests et build
        working-directory: backend
        run: mvn -B clean verify

      # Sur une PR qui ne touche ni le Dockerfile ni les pom.xml, l'image
      # construirait à l'identique : ce garde-fou n'apporte rien et double
      # inutilement le temps du job (téléchargement Maven en doublon, l'image
      # de build ayant son propre dépôt local, distinct du cache setup-java).
      - name: Configurer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Détecter les changements concernant l'image Docker
        id: filtre_docker
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'backend/Dockerfile'
              - 'pom.xml'
              - 'backend/pom.xml'

      # Le déploiement se fait par image Docker : si le Dockerfile casse, on
      # doit le savoir sur la PR, pas au moment du déploiement. `cache-from`/
      # `cache-to` en type=gha réutilisent la couche `dependency:go-offline`
      # entre exécutions - l'image de build a son propre dépôt Maven local,
      # distinct de celui mis en cache par setup-java, donc sans ce cache les
      # dépendances étaient retéléchargées une seconde fois à chaque run.
      - name: Vérifier que l'image se construit
        if: steps.filtre_docker.outputs.docker == 'true' || github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: edukeys-api:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker build` seul ne prouve rien sur l'exécutabilité du jar : un
      # jar non repackagé ("no main manifest attribute") ou compilé pour un
      # bytecode que le JRE de l'image ne sait pas lire (UnsupportedClassVersionError)
      # laisse le build vert et casse au premier déploiement réel. C'est
      # exactement ce qui s'est produit ici, passé inaperçu pendant cinq
      # tâches faute de ce garde-fou.
      #
      # On vérifie seulement que Spring Boot a réellement commencé à démarrer
      # (bannière + "Starting EdukeysApplication") et l'absence des deux
      # erreurs ci-dessus - pas un mode d'échec précis. Aucune base de données
      # ni SPRING_PROFILES_ACTIVE ne sont fournis à ce conteneur : il est
      # normal, et même souhaité (VerificateurProfilActif), qu'il échoue peu
      # après avoir démarré. Un couplage plus fin (exiger l'échec de connexion
      # base) serait fragile au premier changement de configuration qui fait
      # échouer le démarrage plus tôt pour une tout autre raison légitime.
      - name: Vérifier que le conteneur démarre jusqu'à un échec normal (pas un jar cassé)
        if: steps.filtre_docker.outputs.docker == 'true' || github.event_name == 'push'
        run: |
          set +e
          docker run --rm --name edukeys-ci-check edukeys-api:ci > container.log 2>&1
          set -e
          echo "----- Journal du conteneur -----"
          cat container.log

          if grep -q "UnsupportedClassVersionError" container.log; then
            echo "::error::Le jar a été compilé pour une version de Java incompatible avec le JRE de l'image d'exécution (backend/Dockerfile)."
            exit 1
          fi
          if grep -q "no main manifest attribute" container.log; then
            echo "::error::Le jar Docker n'est pas exécutable : spring-boot-maven-plugin n'est plus lié à la phase package (backend/pom.xml)."
            exit 1
          fi
          if ! grep -q "Starting EdukeysApplication" container.log; then
            echo "::error::Spring Boot n'a jamais commencé à démarrer (pas de \"Starting EdukeysApplication\" dans le journal) - le jar ou le runtime Java sont probablement cassés, voir le journal ci-dessus."
            exit 1
          fi
          echo "Conteneur démarré jusqu'à un échec normal (pas de profil ni de base fournis à ce job) : jar exécutable, runtime Java correct."

      - name: Export du contrat OpenAPI
        working-directory: backend
        run: mvn -B -Pgenerate-openapi verify

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/target/openapi.json
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    if: needs.detecter.outputs.frontend_present == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend/

      # Le contrat backend fait autorité. Si les types générés committés
      # divergent de ce que le backend expose réellement, la PR est refusée :
      # sans ce garde-fou, le frontend compile contre un contrat périmé.
      - name: Vérification que les types générés sont à jour
        working-directory: frontend
        run: |
          npm run api:generate -- --input ./openapi.json
          if ! git diff --exit-code src/api/generated/; then
            echo "::error::Les types générés ne correspondent pas au contrat OpenAPI du backend."
            echo "::error::Lance 'npm run api:generate' en local et committe le résultat."
            exit 1
          fi

      - run: npm run typecheck
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm test -- --run
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
