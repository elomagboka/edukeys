name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers a besoin de Docker : disponible nativement sur les
      # runners GitHub, rien à installer.
      #
      # `clean` n'est pas décoratif : Maven ne retire pas de target/ une
      # ressource supprimée des sources. Sans lui, une migration Flyway
      # renommée ou supprimée reste servie depuis target/classes, et le build
      # passe au vert sur un état du schéma qui n'existe dans aucune source.
      - name: Tests et build
        working-directory: backend
        run: mvn -B clean verify

      # Le déploiement se fait par image Docker : si le Dockerfile casse, on
      # doit le savoir sur la PR, pas au moment du déploiement.
      - name: Vérifier que l'image se construit
        run: docker build -f backend/Dockerfile -t edukeys-api:ci .

      - name: Export du contrat OpenAPI
        working-directory: backend
        run: mvn -B -Pgenerate-openapi verify

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/target/openapi.json
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend/

      # Le contrat backend fait autorité. Si les types générés committés
      # divergent de ce que le backend expose réellement, la PR est refusée :
      # sans ce garde-fou, le frontend compile contre un contrat périmé.
      - name: Vérification que les types générés sont à jour
        working-directory: frontend
        run: |
          npm run api:generate -- --input ./openapi.json
          if ! git diff --exit-code src/api/generated/; then
            echo "::error::Les types générés ne correspondent pas au contrat OpenAPI du backend."
            echo "::error::Lance 'npm run api:generate' en local et committe le résultat."
            exit 1
          fi

      - run: npm run typecheck
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm test -- --run
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
