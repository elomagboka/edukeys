server:
  # "framework" fait réécrire request.getRemoteAddr() par ForwardedHeaderFilter
  # à partir du PREMIER élément de X-Forwarded-For — donc à partir d'une valeur
  # que le client peut écrire lui-même. Vérifié localement : une requête portant
  # « X-Forwarded-For: 1.2.3.4, 5.6.7.8 » ressort avec getRemoteAddr() = 1.2.3.4.
  # getRemoteAddr() ne doit donc JAMAIS servir à identifier un client à des fins
  # de sécurité (limitation de débit, journalisation d'attaque) : utiliser
  # FiltreAdresseIpCliente.adresseIpDe(request), qui prend le N-ième élément en
  # partant de la droite (edukeys.securite.reseau.nb-proxys-de-confiance).
  # Le réglage reste utile pour la génération d'URL absolues (Location, OpenAPI),
  # seul usage qui lui est laissé ; ConfigurationEnTetesTransferes réordonne le
  # filtre de Boot pour que l'IP cliente soit calculée avant qu'il n'efface les
  # en-têtes X-Forwarded-*.
  forward-headers-strategy: framework

spring:
  application:
    name: edukeys-backend
  servlet:
    multipart:
      # Borne Tomcat, commune à tous les envois de fichiers : c'est le
      # plafond du plus gros usage, jamais la limite métier d'un module.
      # Dimensionnée pour l'admission en ligne (US-06, AdmissionProperties) :
      # au plus 5 pièces de 5 Mo chacune, 15 Mo cumulés, en un seul appel.
      # Chaque module applique ensuite SA propre borne, plus stricte, depuis
      # sa propre propriété (logo : edukeys.etablissement.taille-max-logo,
      # 1 Mo). Ne jamais rebrancher un module sur la valeur ci-dessous : le
      # relèvement fait pour l'US-06 remonterait en silence le plafond de ce
      # module.
      # Sans cette borne côté Tomcat, un dépassement renvoie une 500 brute
      # avant même d'atteindre le contrôleur.
      max-file-size: 5MB
      # 15 Mo de pièces (AdmissionProperties.tailleMaxTotalPieces) + la partie
      # JSON `demande` : 16 Mo suffit, jamais 20 (B2+I1, revue US-06).
      max-request-size: 16MB
      # B2+I1 : l'analyse multipart par Tomcat doit être paresseuse pour que
      # FiltreVerificationTurnstileAdmission puisse refuser une requête sans
      # jeton Turnstile AVANT que Tomcat n'écrive les fichiers joints sur
      # disque/en mémoire. Aucun filtre placé avant lui n'appelle
      # getParameter()/getParts() sur une route multipart.
      resolve-lazily: true
  # Aucun profil par défaut : SPRING_PROFILES_ACTIVE doit être défini
  # explicitement dans chaque environnement (VerificateurProfilActif fait
  # échouer le démarrage sinon). Un défaut implicite sur "local" a fait
  # démarrer un conteneur de vérification CI avec le profil qui charge
  # db/testdata (comptes de démonstration, mots de passe connus) — jamais
  # légitime hors poste de développement.

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Les contrôleurs de démonstration et de test (@Profile local/test, plus ceux
# du classpath de test) n'existent dans aucun environnement réel. Les laisser
# dans le contrat ferait générer au frontend des types pour des chemins
# fictifs : le typage cesserait d'être une garantie dès lors qu'il décrit des
# endpoints qu'on ne peut pas appeler. Exclusion ici plutôt qu'un filtrage
# après export : elle vaut aussi pour Swagger UI en local et pour
# /v3/api-docs consulté à la main, et une règle déclarative n'a pas à être
# retrouvée dans du code de test au moment d'ajouter un contrôleur interne.
# OpenApiExportTest vérifie que cette propriété fait effectivement son travail
# (une clé mal orthographiée échouerait en silence).
springdoc:
  paths-to-exclude:
    - /internal/**
    - /test-exceptions/**

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

edukeys:
  securite:
    jwt:
      secret: ${EDUKEYS_JWT_SECRET}
    cors:
      origines-autorisees: ${EDUKEYS_CORS_ORIGINES:http://localhost:5173}
    # Durée de validité du mot de passe temporaire (US-04) : au-delà, le
    # jeton d'activation est expiré et /auth/login (ainsi que le changement
    # de mot de passe par le titulaire) refuse avec le code distinct
    # MOT_DE_PASSE_TEMPORAIRE_EXPIRE — l'administrateur doit régénérer via
    # POST /api/v1/utilisateurs/{id}/mot-de-passe-temporaire, pas croire à un
    # mot de passe mal recopié. Quelques jours : assez pour qu'un mot de
    # passe remis en main propre (pas encore de canal email, Sprint 10) soit
    # utilisé, sans rester valable indéfiniment.
    mot-de-passe-temporaire:
      duree-validite: 14d
    reseau:
      # Nombre d'intermédiaires que la requête traverse chez nous (Render :
      # l'edge, donc 1). L'IP cliente retenue est le N-ième élément de
      # X-Forwarded-For EN PARTANT DE LA DROITE : les éléments de gauche
      # sont écrits par le client lui-même et ne sont jamais dignes de
      # confiance. Voir ExtracteurAdresseIpCliente — ce calcul ne dépend
      # d'aucune hypothèse sur le comportement de l'edge, contrairement au
      # premier élément que retenait ForwardedHeaderFilter.
      nb-proxys-de-confiance: ${EDUKEYS_NB_PROXYS_DE_CONFIANCE:1}

    # Limitation de débit sur les endpoints d'authentification (issue #58,
    # CLAUDE.md règle 5). Deux compteurs indépendants par chemin protégé :
    # - par-compte : seuil serré (3 échecs tolérés), protège une cible
    #   désignée contre la force brute sur mot de passe.
    # - par-ip : seuil volontairement large (150 échecs tolérés). Contexte
    #   togolais : les opérateurs mobiles mutualisent leurs adresses
    #   publiques, une école ou un cybercafé entier peut sortir sur une seule
    #   IP — un seuil serré bloquerait tous les parents d'un même opérateur à
    #   cause d'un seul maladroit. Seuil relevé de 50 à 150 en même temps
    #   que la suppression de la remise à zéro du compteur par IP sur
    #   succès : cette remise à zéro le rendait annulable à volonté (un
    #   attaquant disposant d'un seul compte valide repartait d'un budget
    #   neuf après chaque connexion réussie), mais sans elle un seuil bas
    #   gênerait les IP mutualisées. Un seuil est un réglage, une remise à
    #   zéro était un trou. La remise à zéro après succès ne concerne donc
    #   plus QUE le compteur par compte.
    # Attente croissante (delai-initial doublé à chaque échec au-delà du
    # seuil de tolérance, plafonné à delai-plafond), jamais de verrouillage
    # définitif : un verrouillage dur permettrait de bloquer volontairement
    # le compte d'un directeur la veille des bulletins.
    limitation-debit:
      chemins-proteges:
        - /api/v1/auth/login
        - /api/v1/auth/refresh
      # I3 : famille "admission publique" (US-06), compteur IP séparé et plus
      # généreux — jamais de lecture du corps (B1), donc pas de compteur par
      # compte ici. Motifs Ant, jamais un chemin exact : {code} est dynamique.
      chemins-admission:
        - /api/v1/public/etablissements/*/offre-admission
        - /api/v1/public/etablissements/*/demandes-admission
      par-compte:
        seuil-tolerance: 3
        delai-initial: 1s
        delai-plafond: 5m
        duree-expiration: 15m
      par-ip:
        seuil-tolerance: 150
        delai-initial: 1s
        delai-plafond: 5m
        duree-expiration: 15m
      par-ip-admission:
        seuil-tolerance: 500
        delai-initial: 1s
        delai-plafond: 5m
        duree-expiration: 15m
      # 3e revue US-06 : budget de soumissions d'admission RÉUSSIES par IP et
      # par jour. Large à dessein (IP mobiles mutualisées, cybercafés) — le
      # garde-fou de cette route est Turnstile, ce budget ne borne que l'abus
      # automatisé qui l'aurait franchi. Réglable sans nouvelle livraison.
      budget-succes-admission-par-jour: ${EDUKEYS_ADMISSION_BUDGET_SUCCES_PAR_JOUR:100}
      taille-max-corps-octets: 4096
      taille-max-cache: 100000

  # US-00 : plafond applicatif du logo d'établissement. Propriété dédiée,
  # volontairement distincte de spring.servlet.multipart.max-file-size, qui
  # suit le plus gros usage multipart de l'application.
  etablissement:
    taille-max-logo: 1MB

  # US-06 : pré-inscription en ligne. Propriétés dédiées, elles aussi
  # distinctes de la borne Tomcat (CLAUDE.md, point 8 de la spec US-06).
  admission:
    taille-max-piece: 5MB
    taille-max-total-pieces: 15MB
    nombre-max-pieces: 5
    # I2 : plafond d'accusés SMS par numéro et par jour, succès compris.
    max-accuses-par-telephone-par-jour: 3
    # I4 : toute réponse de la soumission publique part au plus tôt au bout de
    # ce délai, création ou dossier déjà existant — sinon le chronomètre dit
    # ce que le corps de la réponse tait.
    plancher-temps-reponse: 1200ms
    sel-hachage-ip: ${EDUKEYS_ADMISSION_SEL_HACHAGE_IP:changez-moi}
    turnstile:
      url-verification: https://challenges.cloudflare.com/turnstile/v0/siteverify
      cle-secrete: ${EDUKEYS_TURNSTILE_CLE_SECRETE:}
      # Délai dépassé = refus. Courts : chaque attente occupe un thread
      # Tomcat partagé avec /auth et le back-office.
      delai-connexion: 2s
      delai-lecture: 3s
