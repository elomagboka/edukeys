# La base des tests est fournie par Testcontainers (voir
# ConfigurationBaseDeTest) : aucune URL en dur ici, sinon elle prendrait le pas
# sur le conteneur et la CI retomberait sur un localhost:5432 inexistant.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata

edukeys:
  securite:
    jwt:
      secret: edukeys-secret-test-fixe-jamais-reutilise-ailleurs-32-octets-min
